- name: Push backup to private repo
  env:
    BACKUP_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
  run: |
    git clone https://x-access-token:${BACKUP_TOKEN}@github.com/vijjada/-ai-tutor-backup.git backup-repo
    cp backup.sql.gz backup-repo/backup-$(date +%F).sql.gz
    cd backup-repo
    git config user.email "bot@yourapp.com"
    git config user.name "Backup Bot"
    git add .
    git commit -m "Backup $(date +%F)"
    git push
